<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂影像互评平台 — AI健康科普视频制作</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  :root{
    --blue:#4a6cf7; --blue-d:#3d5af1; --blue-l:#eef2ff;
    --green:#1fa97a; --ink:#1f2430; --muted:#8a93a6; --line:#edf0f7;
    --bg:#f4f6fb; --card:#fff;
    --shadow:0 2px 10px rgba(30,45,90,.05);
    --shadow2:0 6px 20px rgba(30,45,90,.09);
  }
  body{ font-family:'Inter','Noto Sans SC','PingFang SC',sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  button{ font-family:inherit; }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- 顶栏 ---------- */
  header{ background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; }
  .hd{ max-width:1280px; margin:0 auto; height:60px; display:flex; align-items:center; gap:26px; padding:0 24px; }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px; white-space:nowrap; }
  .logo .lg-ic{ width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#5b8cff,#3d5af1); display:grid; place-items:center; color:#fff; }
  .logo small{ display:block; font-size:10px; color:var(--muted); font-weight:500; }
  nav.top{ display:flex; gap:4px; height:60px; }
  nav.top button{ border:none; background:none; padding:0 16px; font-size:14px; font-weight:600; color:#5a6478; cursor:pointer; position:relative; }
  nav.top button:hover{ color:var(--blue); }
  nav.top button.active{ color:var(--blue); }
  nav.top button.active::after{ content:''; position:absolute; left:14px; right:14px; bottom:0; height:3px; border-radius:3px 3px 0 0; background:var(--blue); }
  .hd-right{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .role-chip{ font-size:11.5px; font-weight:700; padding:4px 12px; border-radius:999px; background:var(--blue-l); color:var(--blue); }
  .role-chip.t{ background:#e6f7f0; color:var(--green); }
  .u-box{ display:flex; align-items:center; gap:9px; cursor:pointer; padding:5px 8px; border-radius:12px; }
  .u-box:hover{ background:#f4f6fb; }
  .u-box .nm{ font-size:13px; font-weight:700; }
  .u-box .gp{ font-size:10.5px; color:var(--muted); }

  main{ max-width:1280px; margin:0 auto; padding:22px 24px 60px; width:100%; }
  .crumb{ font-size:12px; color:var(--muted); margin-bottom:14px; }
  .crumb b{ color:#5a6478; font-weight:600; }
  .foot{ text-align:center; color:#a8b0c2; font-size:11.5px; padding:26px 0 8px; }

  /* ---------- 通用 ---------- */
  .card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; }
  .card h3{ font-size:15px; font-weight:800; margin-bottom:4px; }
  .card .sub{ font-size:11.5px; color:var(--muted); margin-bottom:14px; }
  .btn{ border:none; border-radius:10px; padding:10px 20px; font-size:13px; font-weight:700; cursor:pointer; transition:.15s; }
  .btn-blue{ background:linear-gradient(135deg,#5b8cff,#3d5af1); color:#fff; box-shadow:0 4px 14px rgba(61,90,241,.3); }
  .btn-blue:hover{ transform:translateY(-1px); }
  .btn-ghost{ background:#fff; border:1px solid #e2e8f4; color:#4a5470; }
  .btn-ghost:hover{ border-color:var(--blue); color:var(--blue); }
  .btn-red{ background:#fff0f0; color:#e5484d; }
  .btn-red:hover{ background:#ffe4e4; }
  .btn-sm{ padding:6px 14px; font-size:12px; border-radius:8px; }
  .f-input,.f-select,.f-area{ width:100%; padding:10px 13px; border:1px solid #dde3f0; border-radius:10px; font-size:13px; font-family:inherit; background:#fff; outline:none; }
  .f-input:focus,.f-area:focus{ border-color:var(--blue); }
  .f-label{ font-size:12.5px; font-weight:700; margin-bottom:7px; color:#3a4358; }
  .avatar{ border-radius:50%; display:inline-grid; place-items:center; color:#fff; font-weight:700; flex-shrink:0; }
  .av-24{ width:24px; height:24px; font-size:10.5px; } .av-30{ width:30px; height:30px; font-size:12px; }
  .av-36{ width:36px; height:36px; font-size:14px; } .av-44{ width:44px; height:44px; font-size:17px; }
  .av-stack{ display:inline-flex; } .av-stack .avatar{ margin-left:-7px; border:2px solid #fff; } .av-stack .avatar:first-child{ margin-left:0; }
  .empty{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty .e-icon{ font-size:44px; margin-bottom:10px; }
  .empty p{ font-size:15px; font-weight:700; color:#4a5470; margin-bottom:4px; }
  .empty span{ font-size:12.5px; }
  .g-tag{ display:inline-block; font-size:10.5px; font-weight:700; color:var(--blue); background:var(--blue-l); border-radius:6px; padding:2px 8px; }
  .g-tag.green{ color:var(--green); background:#e6f7f0; }
  .stars{ color:#ffb61e; letter-spacing:2px; } .stars .off{ color:#e3e8f2; }
  .link{ color:var(--blue); font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:none; }
  .link:hover{ text-decoration:underline; }

  /* ---------- 欢迎横幅 ---------- */
  .banner{ border-radius:18px; padding:30px 34px; color:#fff; position:relative; overflow:hidden; margin-bottom:20px; }
  .banner.blue{ background:linear-gradient(115deg,#4a6cf7 0%,#3d5af1 55%,#3550d8 100%); }
  .banner.green{ background:linear-gradient(115deg,#1fa97a 0%,#17a06e 55%,#0f8f60 100%); }
  .banner::after{ content:''; position:absolute; right:-60px; top:-80px; width:280px; height:280px; border-radius:50%; background:rgba(255,255,255,.08); }
  .banner::before{ content:''; position:absolute; right:120px; bottom:-120px; width:220px; height:220px; border-radius:50%; background:rgba(255,255,255,.06); }
  .banner h2{ font-size:21px; font-weight:800; margin-bottom:6px; }
  .banner p{ font-size:12.5px; opacity:.88; margin-bottom:14px; }
  .banner .tags{ display:flex; gap:8px; }
  .banner .tags span{ font-size:11px; font-weight:600; background:rgba(255,255,255,.18); border-radius:999px; padding:5px 12px; }
  .banner .bn-btn{ position:absolute; right:30px; top:50%; transform:translateY(-50%); background:#fff; color:var(--blue-d); border:none; border-radius:12px; padding:11px 22px; font-size:13px; font-weight:800; cursor:pointer; z-index:1; }
  .banner.green .bn-btn{ color:var(--green); }

  /* ---------- 统计卡 ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px; }
  .stat-card{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px 18px; display:flex; align-items:center; gap:12px; }
  .stat-card .ic{ width:40px; height:40px; border-radius:11px; display:grid; place-items:center; flex-shrink:0; }
  .stat-card .lb{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .stat-card .vl{ font-size:20px; font-weight:800; margin-top:2px; }
  .stat-card .vl small{ font-size:11px; color:var(--muted); font-weight:600; }
  .stat-card .ex{ font-size:10.5px; color:var(--muted); margin-top:2px; }
  .stat-card .ex .up{ color:#22a35c; } .stat-card .ex .down{ color:#e5484d; }

  /* ---------- 视频卡 ---------- */
  .v-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .v-grid.c3{ grid-template-columns:repeat(3,1fr); }
  .v-card{ background:var(--card); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); transition:.18s; }
  .v-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow2); }
  .thumb{ position:relative; aspect-ratio:16/9; background:linear-gradient(135deg,#2b3a55,#1b2334); cursor:pointer; overflow:hidden; }
  .thumb img,.thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .play-ov{ position:absolute; inset:0; display:grid; place-items:center; }
  .play-c{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.92); display:grid; place-items:center; box-shadow:0 4px 14px rgba(0,0,0,.25); transition:.15s; }
  .thumb:hover .play-c{ transform:scale(1.08); }
  .play-c::after{ content:''; border-left:14px solid #3d5af1; border-top:9px solid transparent; border-bottom:9px solid transparent; margin-left:3px; }
  .score-pill{ position:absolute; right:10px; bottom:10px; background:rgba(15,20,35,.72); color:#ffd45e; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; }
  .badge-ex{ position:absolute; left:10px; top:10px; background:linear-gradient(135deg,#ffb020,#ff8a3d); color:#fff; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; }
  .badge-own{ position:absolute; left:10px; top:10px; background:linear-gradient(135deg,#2fbf71,#1fa35c); color:#fff; font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; }
  .v-body{ padding:12px 14px 14px; }
  .v-title{ font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:6px; }
  .v-meta{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
  .v-meta .sp{ flex:1; }

  /* ---------- 筛选条 ---------- */
  .filter-bar{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:12px 16px; display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .search-box{ display:flex; align-items:center; gap:7px; background:#f4f6fb; border-radius:10px; padding:8px 12px; flex:1; min-width:180px; max-width:280px; color:#a8b0c2; }
  .search-box input{ border:none; background:none; outline:none; font-size:12.5px; flex:1; font-family:inherit; }
  .seg{ display:flex; background:#f4f6fb; border-radius:10px; padding:3px; gap:2px; }
  .seg button{ border:none; background:none; padding:7px 14px; font-size:12px; font-weight:700; color:#7a8499; border-radius:8px; cursor:pointer; }
  .seg button.active{ background:var(--blue); color:#fff; }
  .sel-mini{ border:1px solid #e2e8f4; border-radius:10px; padding:8px 12px; font-size:12px; font-weight:600; color:#5a6478; background:#fff; cursor:pointer; font-family:inherit; }
  .pgn{ display:flex; justify-content:center; gap:8px; margin-top:24px; }
  .pgn button{ min-width:32px; height:32px; border-radius:9px; border:1px solid #e2e8f4; background:#fff; font-size:12.5px; font-weight:700; color:#5a6478; cursor:pointer; }
  .pgn button.active{ background:var(--blue); color:#fff; border-color:var(--blue); }

  /* ---------- 排行 ---------- */
  .top3-row{ display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:16px; margin-bottom:20px; align-items:stretch; }
  .t3-card{ background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:26px 20px 22px; text-align:center; position:relative; }
  .t3-card.first{ border:2px solid #ffd45e; box-shadow:0 8px 26px rgba(255,190,40,.18); }
  .t3-card .mdl{ font-size:30px; margin-bottom:8px; }
  .t3-card .gn{ font-size:15px; font-weight:800; }
  .t3-card .wt{ font-size:11.5px; color:var(--muted); margin:3px 0 10px; }
  .t3-card .sc{ font-size:26px; font-weight:800; color:var(--blue-d); font-variant-numeric:tabular-nums; }
  table.rank{ width:100%; border-collapse:collapse; }
  table.rank th{ text-align:left; font-size:11.5px; color:var(--muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line); }
  table.rank td{ padding:13px 12px; font-size:13px; border-bottom:1px solid #f3f5fa; }
  table.rank tr:last-child td{ border-bottom:none; }
  table.rank tbody tr{ cursor:pointer; transition:background .12s; }
  table.rank tbody tr:hover{ background:#f7f9fe; }
  .rk-n{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:9px; background:#f1f4fa; color:#7a8499; font-size:12px; font-weight:800; }
  .rk-n.n1{ background:#ffe9b8; color:#9a6b00; } .rk-n.n2{ background:#e8ecf4; color:#5a6478; } .rk-n.n3{ background:#f7e2cd; color:#a05f22; }
  .cell-score{ font-weight:800; color:var(--blue-d); font-variant-numeric:tabular-nums; }
  .chg{ font-weight:700; font-size:12px; } .chg.up{ color:#22a35c; } .chg.down{ color:#e5484d; } .chg.flat{ color:#a8b0c2; }

  /* ---------- 上传 / 我的小组 ---------- */
  .two-col{ display:grid; grid-template-columns:1.6fr 1fr; gap:18px; align-items:start; }
  .drop-zone{ border:2px dashed #ccd6ee; border-radius:14px; padding:38px 20px; text-align:center; cursor:pointer; background:#fafcff; transition:.15s; margin-bottom:16px; }
  .drop-zone:hover,.drop-zone.drag{ border-color:var(--blue); background:#f2f6ff; }
  .drop-zone .dz-ic{ font-size:30px; margin-bottom:8px; }
  .drop-zone p{ font-size:13px; font-weight:700; color:#3a4358; margin-bottom:4px; }
  .drop-zone span{ font-size:11.5px; color:var(--muted); }
  .up-progress{ margin-top:14px; text-align:left; background:#f4f7fd; border-radius:10px; padding:10px 14px; }
  .up-progress .fn{ font-size:12px; font-weight:700; display:flex; justify-content:space-between; }
  .up-progress .fs{ font-size:10.5px; color:var(--muted); margin:3px 0 7px; }
  .up-progress .bar{ height:7px; border-radius:4px; background:#e6ebf6; overflow:hidden; }
  .up-progress .bar i{ display:block; height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,#5b8cff,#3d5af1); transition:width .25s; }
  .cover-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .cover-opt{ position:relative; border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid transparent; aspect-ratio:16/9; }
  .cover-opt img{ width:100%; height:100%; object-fit:cover; display:block; }
  .cover-opt.sel{ border-color:var(--blue); }
  .cover-opt .ck{ position:absolute; right:6px; top:6px; width:18px; height:18px; border-radius:50%; background:var(--blue); color:#fff; font-size:11px; display:grid; place-items:center; }
  .tag-input{ display:flex; flex-wrap:wrap; gap:8px; padding:9px 11px; border:1px solid #dde3f0; border-radius:10px; min-height:44px; cursor:text; }
  .tag-input input{ border:none; outline:none; flex:1; min-width:110px; font-size:13px; font-family:inherit; }
  .tag-chip{ background:var(--blue-l); color:var(--blue-d); font-size:12px; font-weight:700; border-radius:999px; padding:4px 8px 4px 12px; display:inline-flex; align-items:center; gap:6px; }
  .tag-chip b{ cursor:pointer; font-weight:800; }
  .f-block{ margin-bottom:16px; }
  .notice{ font-size:11.5px; color:#a8770a; background:#fff8e6; border-radius:10px; padding:10px 14px; line-height:1.6; }
  .ver-item{ display:flex; gap:11px; padding:11px 0; border-bottom:1px solid #f3f5fa; }
  .ver-item:last-child{ border:none; }
  .ver-badge{ width:30px; height:30px; border-radius:9px; background:var(--blue-l); color:var(--blue); font-size:11px; font-weight:800; display:grid; place-items:center; flex-shrink:0; }

  /* ---------- 详情 / 评分 ---------- */
  .detail-wrap{ display:grid; grid-template-columns:1.7fr 1fr; gap:18px; align-items:start; }
  .player-box{ background:#0d1322; border-radius:16px; overflow:hidden; position:relative; }
  .player-box video{ width:100%; display:block; aspect-ratio:16/9; }
  .dim-row{ display:flex; align-items:center; gap:10px; margin-bottom:13px; }
  .dim-row .dl{ font-size:12.5px; font-weight:600; color:#3a4358; width:64px; flex-shrink:0; }
  .dim-row .dstars{ display:flex; gap:3px; }
  .dim-row .dstars span{ font-size:19px; cursor:pointer; color:#dfe4ee; transition:.1s; }
  .dim-row .dstars span.on{ color:#ffb61e; }
  .dim-bar{ flex:1; height:7px; border-radius:4px; background:#eef1f7; overflow:hidden; position:relative; }
  .dim-bar i{ display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#5b8cff,#3d5af1); }
  .dim-val{ font-size:12px; font-weight:800; color:var(--blue-d); width:42px; text-align:right; font-variant-numeric:tabular-nums; }
  .q-tags{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .q-tags button{ border:1px solid #dfe5f2; background:#f8faff; font-size:11.5px; color:#5a6478; border-radius:999px; padding:5px 12px; cursor:pointer; }
  .q-tags button:hover{ border-color:var(--blue); color:var(--blue); }
  .comment-item{ display:flex; gap:11px; padding:13px 0; border-bottom:1px solid #f3f5fa; }
  .comment-item:last-child{ border:none; }
  .c-hd{ font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .c-hd .tm{ font-size:10.5px; color:#a8b0c2; font-weight:500; }
  .c-tx{ font-size:12.5px; color:#4a5470; line-height:1.7; margin-top:4px; }

  /* ---------- 小组卡 ---------- */
  .g-grid{ display:grid; repeat:4; grid-template-columns:repeat(4,1fr); gap:16px; }
  .g-card{ background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:18px; }
  .g-card .num{ font-size:20px; font-weight:800; color:var(--blue-d); }
  .g-card .gname{ font-size:14px; font-weight:800; margin:2px 0 2px; }
  .g-card .leader{ font-size:11px; color:var(--muted); margin-bottom:8px; }
  .g-card .wtitle{ font-size:12px; color:#4a5470; min-height:18px; margin-bottom:10px; }
  .mem-chips{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .mem-chips span{ font-size:10px; background:#f1f4fa; color:#5a6478; border-radius:6px; padding:3px 7px; font-weight:600; }
  .g-foot{ display:flex; align-items:center; justify-content:space-between; }
  .st-ok{ color:#22a35c; font-size:11.5px; font-weight:700; } .st-no{ color:#e5a13d; font-size:11.5px; font-weight:700; }

  /* ---------- 分析图表 ---------- */
  .chart-bars{ display:flex; align-items:flex-end; gap:14px; height:180px; padding:10px 6px 0; }
  .chart-bars .cb{ flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; height:100%; justify-content:flex-end; }
  .chart-bars .cb i{ width:70%; max-width:34px; border-radius:7px 7px 0 0; background:linear-gradient(180deg,#5b8cff,#3d5af1); transition:height .4s; }
  .chart-bars .cb span{ font-size:10.5px; color:var(--muted); font-weight:600; }
  .donut-wrap{ display:flex; align-items:center; gap:22px; }
  .legend div{ display:flex; align-items:center; gap:8px; font-size:12px; color:#4a5470; padding:5px 0; }
  .legend i{ width:10px; height:10px; border-radius:3px; }

  /* ---------- 弹窗 / Toast ---------- */
  .modal-mask{ position:fixed; inset:0; background:rgba(20,26,40,.45); display:grid; place-items:center; z-index:100; backdrop-filter:blur(3px); }
  .modal{ background:#fff; border-radius:18px; padding:28px 30px; width:370px; max-width:92vw; box-shadow:0 20px 60px rgba(10,16,30,.3); }
  .modal h3{ font-size:17px; font-weight:800; margin-bottom:6px; }
  .modal .md-sub{ font-size:12.5px; color:var(--muted); margin-bottom:16px; }
  .role-pick{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; }
  .role-pick button{ border:2px solid #e2e8f4; background:#f8faff; border-radius:14px; padding:16px 10px; cursor:pointer; font-size:14px; font-weight:700; transition:.15s; }
  .role-pick button.sel{ border-color:var(--blue); background:var(--blue-l); color:var(--blue); }
  #toast{ position:fixed; left:50%; bottom:36px; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .toast-item{ background:rgba(24,30,45,.92); color:#fff; font-size:13px; font-weight:600; padding:11px 22px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.25); }

  @media (max-width:1100px){ .v-grid,.g-grid{ grid-template-columns:repeat(3,1fr); } .stat-row{ grid-template-columns:repeat(2,1fr); } .two-col,.detail-wrap{ grid-template-columns:1fr; } }
  @media (max-width:760px){ .v-grid,.g-grid{ grid-template-columns:repeat(2,1fr); } nav.top button{ padding:0 10px; font-size:13px; } .top3-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ================= 基础 ================= */
const GROUPS = Array.from({length:8},(_,i)=>({id:'g'+(i+1), name:'第'+(i+1)+'组'}));
const TEACHER_PIN = '123456';
const DEADLINE = new Date('2026-10-29T20:00:00');
const DIMS = [['content','内容完整性'],['creativity','创意表现'],['tech','技术制作'],['team','团队协作'],['expr','表达清晰度']];
const QUICK_TAGS = ['画面精美','逻辑清晰','配音专业','创意十足'];
const AV_COLORS = ['#5b8def','#8a63d2','#e0648a','#3aa78d','#e0913a','#4aa3e0','#6b7fd7','#c05a3a'];
const COURSE = 'AI健康科普视频制作';

let DATA = { works:{}, ratings:{} };
let ME = JSON.parse(localStorage.getItem('xkj_identity') || 'null');
if(ME && ME.role==='teacher'){ ME.name='林老师'; localStorage.setItem('xkj_identity',JSON.stringify(ME)); }
let uploading = false;

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){
  const d = document.createElement('div'); d.className='toast-item'; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(()=>{ d.style.opacity='0'; d.style.transition='.3s'; setTimeout(()=>d.remove(),320); }, 2400);
}
function avColor(name){ let h=0; for(const c of String(name)) h=(h*31+c.charCodeAt(0))>>>0; return AV_COLORS[h%AV_COLORS.length]; }
function avatar(name, cls='av-30'){ return `<span class="avatar ${cls}" style="background:${avColor(name)}">${esc(String(name||'?').slice(0,1))}</span>`; }
function fmtDur(s){ s=Math.max(0,Math.round(s||0)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtTime(t){ const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtDay(t){ const d=new Date(t); const today=new Date(); const yest=new Date(Date.now()-86400000);
  const p=n=>String(n).padStart(2,'0'); const hm=`${p(d.getHours())}:${p(d.getMinutes())}`;
  if(d.toDateString()===today.toDateString()) return '今天 '+hm;
  if(d.toDateString()===yest.toDateString()) return '昨天 '+hm;
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${hm}`; }

/* 评分计算：内部 100 分制，界面展示 5 分制（与评分星级一致） */
const rateAvg = r => (r.dims.content+r.dims.creativity+r.dims.tech+r.dims.team+r.dims.expr)/5; // 1-5
const rateScore = r => rateAvg(r)*20; // 0-100
const disp = avg100 => (avg100/20).toFixed(2); // 展示为 5 分制
function workRatings(wid){ return Object.entries(DATA.ratings[wid]||{}).map(([rid,r])=>({rid,...r})); }
function workAvg(wid){ const rs=workRatings(wid); return rs.length ? rs.reduce((a,r)=>a+rateScore(r),0)/rs.length : null; }
function rankedWorks(){
  return Object.entries(DATA.works).map(([id,w])=>({id,...w,avg:workAvg(id),rc:workRatings(id).length}))
    .filter(w=>w.avg!=null).sort((a,b)=>b.avg-a.avg);
}
const gNameOf = id => GROUPS.find(g=>g.id===id)?.name || id;
function starsHTML(avg100, size){
  const full = avg100==null ? 0 : Math.round(avg100/20);
  let h=''; for(let i=1;i<=5;i++) h+=`<span class="${i<=full?'':'off'}">★</span>`;
  return `<span class="stars"${size?` style="font-size:${size}px"`:''}>${h}</span>`;
}

/* ================= 数据 ================= */
async function loadData(rerender=true){
  try{
    const [w,r] = await Promise.all([fetch('/api/works').then(x=>x.json()), fetch('/api/ratings').then(x=>x.json())]);
    DATA = {works:w||{}, ratings:r||{}};
    if(rerender && !uploading && !location.hash.startsWith('#/group') && !location.hash.startsWith('#/work') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')) renderRoute();
  }catch(e){}
}
async function api(url, body){
  const res = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(j.error||'请求失败');
  return j;
}

function setActiveMenu(){
  const h = location.hash || (ME.role==='teacher'?'#/teacher':'#/home');
  document.querySelectorAll('nav.top button').forEach(b=>{
    const bh=b.dataset.h;
    let on = h===bh;
    if(bh==='#/gallery' && h.startsWith('#/work')) on=true;
    if(bh==='#/teacher/videos' && h.startsWith('#/work')) on=true;
    b.classList.toggle('active',on);
  });
}
function renderRoute(){
  if(!ME) return;
  setActiveMenu();
  const h = location.hash || (ME.role==='teacher'?'#/teacher':'#/home');
  if(h.startsWith('#/work/')) return renderWork(decodeURIComponent(h.slice(7)));
  if(ME.role==='teacher'){
    if(h==='#/teacher/videos') return renderTVideos();
    if(h==='#/teacher/groups') return renderTGroups();
    if(h==='#/teacher/analytics') return renderTAnalytics();
    return renderTHome();
  }
  if(h==='#/gallery') return renderGallery();
  if(h==='#/ranking') return renderRanking();
  if(h==='#/group') return renderGroup();
  return renderHome();
}
const crumb = t => `<div class="crumb">${t}</div>`;

function vCard(w,myId){
  const mine = ME.role==='student' && w.id===myId;
  const rated = ME.role==='student' && (DATA.ratings[w.id]||{})[myId];
  return `<div class="v-card">
    <div class="thumb" onclick="location.hash='#/work/${w.id}'">
      ${w.cover?`<img src="/api/file/${w.cover}" alt="">`:`<video src="/api/file/${w.file}" preload="metadata" muted></video>`}
      ${mine?'<span class="badge-own">本组作品</span>':(w.avg!=null&&w.avg>=90?'<span class="badge-ex">优秀作品</span>':'')}
      <div class="play-ov"><span class="play-c"></span></div>
      ${w.avg!=null?`<span class="score-pill">★ ${disp(w.avg)}</span>`:''}
    </div>
    <div class="v-body">
      <div class="v-title">${gNameOf(w.id)}｜${esc(w.title)}</div>
      <div class="v-meta"><span>● ${w.views||0}次观看</span><span class="sp"></span>
        ${mine?`<span class="g-tag green">我的小组</span>`:rated?`<a class="link" onclick="event.stopPropagation();location.hash='#/work/${w.id}'">已评 ✓ 修改</a>`:`<a class="link" onclick="event.stopPropagation();location.hash='#/work/${w.id}'">去评分</a>`}
      </div>
    </div>
  </div>`;
}

/* ================= 学生 · 视频广场 ================= */
let galTab='all', galQ='', galPage=1;
function renderGallery(){
  const myId=ME.group;
  const all=Object.entries(DATA.works).map(([id,w])=>({id,...w,avg:workAvg(id),rc:workRatings(id).length}));
  const myRated = wid => !!(DATA.ratings[wid]||{})[myId];
  let list=all.slice();
  if(galTab==='unrated') list=list.filter(w=>w.id!==myId&&!myRated(w.id));
  if(galTab==='rated') list=list.filter(w=>myRated(w.id));
  if(galTab==='excellent') list=list.filter(w=>w.avg!=null&&w.avg>=90);
  if(galQ){ const q=galQ.toLowerCase(); list=list.filter(w=>(w.title+gNameOf(w.id)).toLowerCase().includes(q)); }
  list.sort((a,b)=>(b.avg??-1)-(a.avg??-1));
  const per=8, pages=Math.max(1,Math.ceil(list.length/per));
  galPage=Math.min(galPage,pages);
  const pageList=list.slice((galPage-1)*per,galPage*per);

  $('#view').innerHTML = crumb(`学生端 / <b>视频广场</b>`)+`
    <div class="filter-bar">
      <div class="search-box">🔍<input id="gq" placeholder="搜索视频标题或小组" value="${esc(galQ)}"></div>
      <div class="seg" id="gseg">
        <button data-t="all" class="${galTab==='all'?'active':''}">全部作品</button>
        <button data-t="unrated" class="${galTab==='unrated'?'active':''}">待我评分</button>
        <button data-t="rated" class="${galTab==='rated'?'active':''}">已评分</button>
        <button data-t="excellent" class="${galTab==='excellent'?'active':''}">优秀作品</button>
      </div>
      <span style="flex:1"></span>
      <select class="sel-mini" id="gTheme"><option>主题：全部</option></select>
      <select class="sel-mini" id="gSort"><option>排序：综合评分</option><option>排序：最新提交</option></select>
    </div>
    ${all.length===0?`<div class="card"><div class="empty"><div class="e-icon">🎬</div><p>还没有小组上传作品</p><span>第一个上传的小组将出现在这里，快去「我的小组」上传本组作品吧</span></div></div>`
    :pageList.length===0?`<div class="card"><div class="empty"><div class="e-icon">🔍</div><p>没有符合条件的作品</p><span>换个筛选条件或搜索词试试</span></div></div>`
    :`<div class="v-grid">${pageList.map(w=>vCard(w,myId)).join('')}</div>
      ${pages>1?`<div class="pgn">${Array.from({length:pages},(_,i)=>`<button class="${i+1===galPage?'active':''}" data-p="${i+1}">${i+1}</button>`).join('')}</div>`:''}
      <div class="foot" style="padding-top:16px">学生端 · 共 ${list.length} 组作品 · 互评截止时间 2026-10-29 20:00</div>`}`;
  $('#gq').oninput=e=>{ galQ=e.target.value; galPage=1; const v=e.target,pos=v.selectionStart; renderGallery(); const n=$('#gq'); n.focus(); n.setSelectionRange(pos,pos); };
  $('#gseg').querySelectorAll('button').forEach(b=>b.onclick=()=>{ galTab=b.dataset.t; galPage=1; renderGallery(); });
  document.querySelectorAll('.pgn button').forEach(b=>b.onclick=()=>{ galPage=+b.dataset.p; renderGallery(); window.scrollTo(0,0); });
  $('#gTheme').onchange=()=>toast('主题筛选建设中');
  $('#gSort').onchange=e=>{ if(e.target.selectedIndex===1){ galTab='all'; list=null; const l2=Object.entries(DATA.works).map(([id,w])=>({id,...w,avg:workAvg(id),rc:workRatings(id).length})).sort((a,b)=>b.time-a.time); renderSortedList(l2); } };
}
function renderSortedList(list){
  const myId=ME.group;
  $('#view').innerHTML = crumb(`学生端 / <b>视频广场</b>`)+`
    <div class="filter-bar">
      <div class="search-box">🔍<input placeholder="搜索视频标题或小组" disabled></div>
      <span style="flex:1"></span>
      <select class="sel-mini" id="gSort2"><option>排序：最新提交</option><option>排序：综合评分</option></select>
    </div>
    <div class="v-grid">${list.map(w=>vCard(w,myId)).join('')}</div>`;
  $('#gSort2').onchange=()=>{ renderGallery(); };
}

async function delMyWork(){

async function pickFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!['mp4','mov','avi'].includes(ext)) return toast('仅支持 MP4 / MOV / AVI 视频');
  if(f.size>2*1024*1024*1024) return toast('文件超过 2GB 上限');
  const up=$('#upProg'); if(!up) return;
  upFile=f;
  up.style.display='block';
  $('#upName').textContent=f.name; $('#upSize').textContent=(f.size/1024/1024).toFixed(0)+'MB';
  $('#upPct').textContent='解析中…'; $('#upBar').style.width='0%';
  try{
    const {frames,duration}=await extractFrames(f);
    upFrames=frames; upDuration=duration; upCoverIdx=frames.length>1?1:0;
    $('#upPct').textContent='待上传';
    const row=$('#coverRow');
    row.innerHTML=frames.map((fr,i)=>`<div class="cover-opt ${i===upCoverIdx?'sel':''}" data-i="${i}"><img src="${fr}">${i===upCoverIdx?'<span class="ck">✓</span>':''}</div>`).join('');
    $('#coverBlock').style.display='block';
    row.querySelectorAll('.cover-opt').forEach(c=>c.onclick=()=>{
      upCoverIdx=+c.dataset.i;
      row.querySelectorAll('.cover-opt').forEach(x=>{x.classList.toggle('sel',+x.dataset.i===upCoverIdx); const ck=x.querySelector('.ck'); if(ck)ck.remove(); if(+x.dataset.i===upCoverIdx)x.insertAdjacentHTML('beforeend','<span class="ck">✓</span>');});
    });
  }catch(e){ toast('视频解析失败，请换文件试试'); upFile=null; $('#upProg').style.display='none'; }
}
function extractFrames(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.muted=true; v.playsInline=true; v.preload='auto'; v.src=url;
    const fail=()=>{URL.revokeObjectURL(url);reject(new Error('bad video'));};
    v.onerror=fail;
    v.onloadedmetadata=async()=>{
      try{
        const dur=v.duration||0, frames=[];
        for(const p of [0.1,0.35,0.6,0.85]){
          await new Promise(r=>{ v.onseeked=r; v.currentTime=Math.min(dur-0.05, dur*p); });
          const c=document.createElement('canvas');
          c.width=360; c.height=Math.round(360*(v.videoHeight||9)/(v.videoWidth||16))||202;
          c.getContext('2d').drawImage(v,0,0,c.width,c.height);
          frames.push(c.toDataURL('image/jpeg',0.82));
        }
        URL.revokeObjectURL(url);
        resolve({frames,duration:dur});
      }catch(e){ fail(); }
    };
  });
}
function dataURLtoBlob(d){ const [h,b]=d.split(','); const mime=h.match(/:(.*?);/)[1]; const bin=atob(b); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
function submitWork(){
  if(uploading) return;
  if(!upFile && !DATA.works[ME.group]) return toast('请先选择视频文件');
  const title=$('#fTitle').value.trim();
  if(!title) return toast('请填写作品名称');
  const onlyUpdateTitle = !upFile && DATA.works[ME.group];
  const fd=new FormData();
  fd.append('groupId',ME.group);
  fd.append('title',title);
  if(upFile){
    fd.append('duration',upDuration);
    fd.append('video',upFile);
    if(upFrames[upCoverIdx]) fd.append('cover',dataURLtoBlob(upFrames[upCoverIdx]),'cover.jpg');
  }
  uploading=true;
  const xhr=new XMLHttpRequest();
  xhr.open('POST','/api/upload');
  xhr.upload.onprogress=e=>{ if(e.lengthComputable){ const p=Math.round(e.loaded/e.total*100); $('#upBar').style.width=p+'%'; $('#upPct').textContent=p+'%'; } };
  xhr.onload=()=>{
    uploading=false;
    if(xhr.status===200){ toast(onlyUpdateTitle?'✅ 名称已更新':'✅ 作品发布成功'); upFile=null; loadData(false).then(()=>renderGroup()); }
    else{ let msg='上传失败'; try{msg=JSON.parse(xhr.responseText).error||msg;}catch(e){} toast('❌ '+msg); $('#upPct').textContent='上传失败'; }
  };
  xhr.onerror=()=>{ uploading=false; toast('❌ 网络错误，上传中断'); };
  $('#btnSubmit').disabled=true; $('#btnSubmit').textContent='上传中…';
  xhr.send(fd);
}

  const totalRatings=Object.values(DATA.ratings).reduce((a,m)=>a+Object.keys(m).length,0);
  const submitted=works.length;
  const groupsDone=GROUPS.filter(g=>DATA.works[g.id] && works.every(w=>w.id===g.id||(DATA.ratings[w.id]||{})[g.id])).length;
  const completion=GROUPS.length?Math.round(groupsDone/GROUPS.length*100):0;
  const latest=works.slice().sort((a,b)=>b.time-a.time).slice(0,3);
  const todayStart=new Date(); todayStart.setHours(0,0,0,0);
  const todayNew=works.filter(w=>w.time>=todayStart.getTime()).length;
  const feed=[];
  latest.slice(0,3).forEach(w=>feed.push({c:'#4a6cf7',t:`${gNameOf(w.id)} 发布了新视频`,tm:w.time}));
  const recentRates=[];
  Object.entries(DATA.ratings).forEach(([wid,m])=>Object.entries(m).forEach(([rid,r])=>{ if(DATA.works[wid]) recentRates.push({rid,tm:r.time}); }));
  recentRates.sort((a,b)=>b.tm-a.tm);
  const doneGroups=[...new Set(recentRates.map(r=>r.rid))].slice(0,2);
  doneGroups.forEach(rid=>{ const r=recentRates.find(x=>x.rid===rid); feed.push({c:'#22a35c',t:`${gNameOf(rid)} 完成了互评`,tm:r.tm}); });
  feed.sort((a,b)=>b.tm-a.tm);

  $('#view').innerHTML = `
    <div class="banner green">
      <h2>${esc(ME.name)}，${new Date().getHours()<12?'上午好':new Date().getHours()<18?'下午好':'晚上好'}</h2>
      <p>${COURSE} · 本轮视频互评正在进行中。</p>
      <div class="tags"><span>互评截止：2026-10-29 20:00</span><span>当前完成率 ${completion}%</span></div>
      <button class="bn-btn" id="bnExport">导出成绩报告</button>
    </div>
    <div class="stat-row">
      <div class="stat-card"><span class="ic" style="background:var(--blue-l)">👥</span><div><div class="lb">班级小组</div><div class="vl">${GROUPS.length}<small> 全部已建组</small></div></div></div>
      <div class="stat-card"><span class="ic" style="background:#e6f7f0">🎬</span><div><div class="lb">已提交视频</div><div class="vl">${submitted}<small> ${GROUPS.length-submitted} 组未提交</small></div></div></div>
      <div class="stat-card"><span class="ic" style="background:#fff7e8">📥</span><div><div class="lb">今日新增</div><div class="vl">${todayNew}<small> 份作品</small></div></div></div>
      <div class="stat-card"><span class="ic" style="background:#f3efff">📈</span><div><div class="lb">互评完成率</div><div class="vl">${completion}<small>%</small></div></div></div>
    </div>
    <div class="two-col" style="grid-template-columns:1.9fr 1fr">
      <div class="card">
        <div style="display:flex;align-items:baseline;margin-bottom:14px"><h3 style="margin:0">最近提交的视频</h3><span style="font-size:11.5px;color:var(--muted);margin-left:8px">学生提交后会直接进入视频广场</span><span style="flex:1"></span><a class="link" onclick="location.hash='#/teacher/videos'">进入视频管理 →</a></div>
        ${latest.length===0?`<div style="color:var(--muted);font-size:12.5px;padding:22px 0">还没有小组提交视频</div>`
        :latest.map(w=>`
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f3f5fa">
            <div style="width:56px;height:36px;border-radius:8px;overflow:hidden;background:#e8ecf4;flex-shrink:0">${w.cover?`<img src="/api/file/${w.cover}" style="width:100%;height:100%;object-fit:cover">`:''}</div>
            <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">${gNameOf(w.id)}</div><div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.title)} · ${fmtDay(w.time)}</div></div>
            <button class="btn btn-ghost btn-sm" onclick="location.hash='#/work/${w.id}'">查看</button>
            <button class="btn btn-red btn-sm" onclick="delWork('${w.id}','${esc(w.title)}')">删除</button>
          </div>`).join('')}
      </div>
      <div class="card">
        <h3>班级动态</h3>
        <div style="margin-top:10px">
        ${feed.length===0?`<div style="color:var(--muted);font-size:12.5px;padding:18px 0">暂无动态</div>`
        :feed.slice(0,6).map(f=>`<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f3f5fa;font-size:12.5px"><span style="color:${f.c}">●</span><div><b>${f.t}</b><div style="font-size:10.5px;color:var(--muted);margin-top:2px">${fmtDay(f.tm)}</div></div></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <h3>提交进度 <span style="font-size:11px;color:var(--muted);font-weight:600">${GROUPS.length} 个小组的当前状态</span></h3>
      <table class="rank" style="margin-top:8px">
        <thead><tr><th>小组</th><th>作品名称</th><th>提交状态</th><th>互评进度</th><th>当前排名</th></tr></thead>
        <tbody>
        ${GROUPS.map(g=>{
          const w=DATA.works[g.id];
          const need=works.filter(x=>x.id!==g.id).length;
          const done=works.filter(x=>x.id!==g.id&&(DATA.ratings[x.id]||{})[g.id]).length;
          const pct=need?Math.round(done/need*100):(w?100:0);
          const rIdx=ranked.findIndex(x=>x.id===g.id);
          return `<tr ${w?`onclick="location.hash='#/work/${g.id}'"`:''}>
            <td><b>${g.name}</b></td>
            <td>${w?esc(w.title):'—'}</td>
            <td>${w?'<span class="g-tag green">已提交</span>':'<span class="g-tag" style="color:#b57708;background:#fdf3e0">未提交</span>'}</td>
            <td>${w?pct+'%':'0%'}</td>
            <td>${rIdx>=0?'第'+(rIdx+1)+'名':'<span style="color:var(--muted)">暂无排名</span>'}</td>
          </tr>`;}).join('')}
        </tbody>
      </table>
    </div>`;
  $('#bnExport').onclick=exportCSV;
}
function exportCSV(){
  const ranked=rankedWorks();
  if(ranked.length===0) return toast('暂无数据可导出');
  let csv='﻿排名,小组,作品名称,平均分(5分制),评分人次,观看数\n';
  ranked.forEach((w,i)=>{ csv+=`${i+1},${gNameOf(w.id)},"${w.title.replace(/"/g,'""')}",${disp(w.avg)},${w.rc},${w.views||0}\n`; });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=COURSE+'-成绩报告.csv'; a.click();
  toast('📄 成绩报告已导出');
}

/* ================= 教师 · 视频管理 ================= */
let tvQ='';
function renderTVideos(){
  startTeacherTimer();
  const works=Object.entries(DATA.works).map(([id,w])=>({id,...w,avg:workAvg(id),rc:workRatings(id).length}));
  let list=works.slice().sort((a,b)=>b.time-a.time);
  if(tvQ){ const q=tvQ.toLowerCase(); list=list.filter(w=>(w.title+gNameOf(w.id)).toLowerCase().includes(q)); }
  const todayStart=new Date(); todayStart.setHours(0,0,0,0);
  const todayNew=works.filter(w=>w.time>=todayStart.getTime()).length;
  const high=works.filter(w=>w.avg!=null&&w.avg>=90).length;

  $('#view').innerHTML = crumb(`教师端 / <b>视频管理</b>`)+`
    <div class="filter-bar">
      <div class="search-box">🔍<input id="tvq" placeholder="搜索小组或视频标题" value="${esc(tvQ)}"></div>
      <div class="seg"><button class="active">全部视频 ${works.length}</button><button onclick="toast('按今日新增筛选建设中')">今日新增 ${todayNew}</button><button onclick="toast('高分作品筛选建设中')">高分作品 ${high}</button></div>
    </div>
    <div class="card">
      <h3>学生提交视频 <span style="font-size:11px;color:var(--muted);font-weight:600">学生可自行修改和删除；教师可查看或删除不合适的内容</span></h3>
      ${list.length===0?`<div class="empty" style="padding:34px"><div class="e-icon">📭</div><p>还没有小组提交视频</p></div>`
      :`<table class="rank" style="margin-top:8px">
        <thead><tr><th>小组</th><th>视频信息</th><th>发布时间</th><th>观看次数</th><th>评分人数</th><th>综合得分</th><th style="width:130px">操作</th></tr></thead>
        <tbody>
        ${list.map(w=>`<tr>
          <td><b>${gNameOf(w.id)}</b></td>
          <td><div style="font-weight:700">${esc(w.title)}</div><div style="font-size:10.5px;color:var(--muted)">时长 ${fmtDur(w.duration)}</div></td>
          <td>${fmtDay(w.time)}</td>
          <td>${w.views||0}</td>
          <td>${w.rc}</td>
          <td>${w.avg!=null?`<span class="cell-score">${disp(w.avg)}</span>`:'<span style="color:var(--muted)">--</span>'}</td>
          <td><button class="btn btn-ghost btn-sm" onclick="location.hash='#/work/${w.id}'">查看</button>
              <button class="btn btn-red btn-sm" onclick="delWork('${w.id}','${esc(w.title)}')">删除</button></td>
        </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
    <div class="notice" style="margin-top:14px">⚠️ 删除视频操作不可撤销，相关评分和排行榜数据将同步清除，请谨慎操作。</div>`;
  $('#tvq').oninput=e=>{ tvQ=e.target.value; const v=e.target,pos=v.selectionStart; renderTVideos(); const n=$('#tvq'); n.focus(); n.setSelectionRange(pos,pos); };
}

  $('#view').innerHTML = crumb(`教师端 / <b>小组管理</b>`)+`
    <div class="filter-bar">
      <div class="search-box">🔍<input placeholder="搜索学生姓名或小组" disabled></div>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--muted)">共 ${GROUPS.length} 个小组</span>
    </div>

      ${GROUPS.map((g,i)=>{

          </div>
        </div>`;}).join('')}

/* ================= 教师 · 成绩分析 ================= */
function renderTAnalytics(){
  startTeacherTimer();
  const ranked=rankedWorks();
  const allAvgs=ranked.map(w=>w.avg);
  const classAvg=allAvgs.length?allAvgs.reduce((a,b)=>a+b,0)/allAvgs.length:null;
  const totalRatings=Object.values(DATA.ratings).reduce((a,m)=>a+Object.keys(m).length,0);
  const works=Object.entries(DATA.works).map(([id,w])=>({id,...w}));
  const groupsDone=GROUPS.filter(g=>DATA.works[g.id] && works.every(w=>w.id===g.id||(DATA.ratings[w.id]||{})[g.id]));
  const doing=GROUPS.filter(g=>DATA.works[g.id] && !groupsDone.includes(g));
  const notStart=GROUPS.filter(g=>!DATA.works[g.id]);
  const total=GROUPS.length;
  const pDone=Math.round(groupsDone.length/total*100), pDoing=Math.round(doing.length/total*100), pNot=100-pDone-pDoing;
  const maxAvg=ranked.length?ranked[0]:null;
  const max5=maxAvg?maxAvg.avg/20:0;
  // 环形图角度
  const c=2*Math.PI*54;
  const aDone=pDone/100*c, aDoing=pDoing/100*c;

  $('#view').innerHTML = crumb(`教师端 / <b>成绩分析</b>`)+`
    <div class="stat-row">
      <div class="stat-card"><span class="ic" style="background:var(--blue-l)">⭐</span><div><div class="lb">班级平均分</div><div class="vl">${classAvg!=null?disp(classAvg):'--'}</div><div class="ex">满分 5 分</div></div></div>
      <div class="stat-card"><span class="ic" style="background:#e6f7f0">✅</span><div><div class="lb">有效评分</div><div class="vl">${totalRatings}</div><div class="ex">条互评记录</div></div></div>
      <div class="stat-card"><span class="ic" style="background:#fff7e8">👥</span><div><div class="lb">完成互评小组</div><div class="vl">${groupsDone.length}/${total}</div><div class="ex">${doing.length} 组进行中</div></div></div>
      <div class="stat-card"><span class="ic" style="background:#f3efff">🏆</span><div><div class="lb">最高互评分</div><div class="vl">${maxAvg?disp(maxAvg.avg):'--'}</div><div class="ex">${maxAvg?gNameOf(maxAvg.id):''}</div></div></div>
    </div>
    <div class="two-col" style="grid-template-columns:1.6fr 1fr">
      <div class="card">
        <h3>各组互评得分 <span style="font-size:11px;color:var(--muted);font-weight:600">按学生互评平均分统计（5 分制）</span></h3>
        ${ranked.length===0?`<div style="color:var(--muted);font-size:12.5px;padding:40px 0;text-align:center">暂无评分数据</div>`
        :`<div class="chart-bars">${GROUPS.map(g=>{
            const a=workAvg(g.id);
            return `<div class="cb"><i style="height:${a!=null?Math.max(6,a/100*150):4}px;${a==null?'background:#e8ecf4':''}"></i><span>${g.name.replace('第','').replace('组','')}</span></div>`;}).join('')}
        </div>`}
      </div>
      <div class="card">
        <h3>互评完成情况</h3>
        <div class="donut-wrap" style="margin-top:12px">
          <svg width="128" height="128">
            <circle cx="64" cy="64" r="54" fill="none" stroke="#eef1f7" stroke-width="14"/>
            <circle cx="64" cy="64" r="54" fill="none" stroke="#4a6cf7" stroke-width="14" stroke-dasharray="${aDone} ${c}" transform="rotate(-90 64 64)"/>
            <circle cx="64" cy="64" r="54" fill="none" stroke="#34c46e" stroke-width="14" stroke-dasharray="${aDoing} ${c}" stroke-dashoffset="${-aDone}" transform="rotate(-90 64 64)"/>
            <text x="64" y="70" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2430">${pDone}%</text>
          </svg>
          <div class="legend">
            <div><i style="background:#4a6cf7"></i>已完成 ${pDone}%</div>
            <div><i style="background:#34c46e"></i>进行中 ${pDoing}%</div>
            <div><i style="background:#eef1f7"></i>未开始 ${pNot}%</div>
          </div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <div style="display:flex;align-items:baseline;margin-bottom:8px"><h3 style="margin:0">互评成绩明细</h3><span style="flex:1"></span><a class="link" onclick="exportCSV()">导出 Excel</a></div>
      ${ranked.length===0?`<div style="color:var(--muted);font-size:12.5px;padding:26px 0;text-align:center">暂无数据</div>`
      :`<table class="rank">
        <thead><tr><th style="width:70px">排名</th><th>小组</th><th>作品</th><th>有效评分人数</th><th>互评平均分</th><th>操作</th></tr></thead>
        <tbody>
        ${ranked.map((w,i)=>`<tr>
          <td><span class="rk-n ${i<3?'n'+(i+1):''}">${i+1}</span></td>
          <td><b>${gNameOf(w.id)}</b></td>
          <td>${esc(w.title)}</td>
          <td>${w.rc} 人</td>
          <td><span class="cell-score">${disp(w.avg)}</span></td>
          <td><a class="link" onclick="location.hash='#/work/${w.id}'">查看详情</a></td>
        </tr>`).join('')}
        </tbody>
      </table>`}
    </div>`;
}
